version: '3.8'

services:
  crm-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-backend-image:latest
    container_name: crm-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://crm-database:5432/crm_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - '9000:9000'
    networks:
      - app-network
    depends_on:
      - crm-database

  crm-database:
    image: postgres:15
    container_name: crm-database
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crm_db
    volumes:
      - crm_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  crm_data:

networks:
  app-network:
    driver: bridge